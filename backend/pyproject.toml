[tool.poetry]
name = "fielddesk-api"
version = "0.1.0"
description = "FieldDesk API - Django backend"
authors = ["Shaheen <muhammedshaheen.tkb@gmail.com>"]
readme = "README.md"
packages = [
    { include = "apps" },
    { include = "config" },
]

[tool.poetry.dependencies]
python = "^3.10"
django = ">=5.0,<6.0"
djangorestframework = "^3.15.0"
djangorestframework-simplejwt = "^5.3.0"
django-cors-headers = "^4.3.0"
django-filter = "^24.0"
psycopg2-binary = "^2.9.9"
redis = "^5.0.0"
celery = "^5.4.0"
channels = { version = "^4.2.0", extras = ["daphne"] }
channels-redis = "^4.2.0"
django-environ = "^0.12.0"
structlog = "^24.1.0"
argon2-cffi = "^23.1.0"
Pillow = "^10.0.0"
gunicorn = "^21.0"
uvicorn = "^0.30.0"
whitenoise = "^6.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-django = "^4.8.0"
pytest-asyncio = "^0.23.0"
factory-boy = "^3.3.0"
faker = "^22.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
